# WARNING. DO NOT EDIT THIS FILE.
# This file is GENERATED by ratos-cartographer/build.py from cartographer.base.cfg
# and the RatOS macros installed on this printer. Re-run build.py after RatOS updates.
# To override settings from this file, copy the relevant sections into printer.cfg.

# Configurator Metadata
# {
#   "type": "static-probe",
#   "title": "Cartographer 3D"
# }

#####
# CARTOGRAPHER HARDWARE CONFIGURATION
# Requires the Cartographer3D Klipper plugin (cartographer3d-plugin >= 1.9):
# https://docs.cartographer3d.com
#####
[mcu cartographer]
# USB: /dev/cartographer is created by 99-cartographer.rules (see ratos-cartographer/install.sh).
#      Alternatively set your /dev/serial/by-id/usb-Cartographer_... path in printer.cfg.
# CAN: set canbus_uuid in printer.cfg; build.py then leaves the two USB lines below out.
serial: /dev/cartographer
restart_method: command

[cartographer]
mcu: cartographer
# IMPORTANT: set your real probe offsets in printer.cfg, e.g.
# [cartographer]
# x_offset: -28.18
# y_offset: -6.37
x_offset: 0
y_offset: 0
verbose: no

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 105

# Multi-MCU homing (Cartographer + mainboard) needs more than Klipper's default 25ms sync window
# on slower hosts, otherwise "Communication timeout during homing". Module: ratos-cartographer/klippy.
[trsync_timeout]
timeout: 0.05

[stepper_z]
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

# NOTE: Cartographer requires [bed_mesh] zero_reference_position. It is also the
# XY position used for touch homing (true zero). Set it to the center of your bed
# in printer.cfg, e.g.
# [bed_mesh]
# zero_reference_position: 250,250

# Cartographer V4 has an onboard ADXL345. To use it for input shaper calibration AND the
# RatOS Analysis page (Stream -> Accelerometer -> "Control Board"), add this to printer.cfg
# (V4 only! V3 uses cs_pin: cartographer:PA3). Only do this if no ADXL is wired to the controlboard.
# [adxl345 controlboard]
# cs_pin: cartographer:PA0
# spi_bus: spi1
# [resonance_tester]
# accel_chip: adxl345 controlboard

#####
# CARTOGRAPHER RATOS CONFIGURATION
#####
[gcode_macro RatOS]
variable_z_probe: "static"
variable_cartographer_touch_start_print_true_zero: True # touch home (nozzle contact) for true Z=0 during START_PRINT,
                                                        # after z-tilt and before bed meshing
variable_cartographer_touch_true_zero_temp: 150         # nozzle temperature for touch (Cartographer default/max: 150C).
                                                        # Touch waits until the nozzle is at most 1C above this.
variable_prime_blob_z: 0.5                              # nozzle height (mm above the measured bed) while extruding the prime blob.
                                                        # Raise (e.g. 1.5) if the blob engulfs the nozzle.

#####
# CARTOGRAPHER MACROS
#####
[gcode_macro _CARTOGRAPHER_START_PRINT_TRUE_ZERO]
description: Internal. Touch homes Z with the Cartographer during START_PRINT.
gcode:
	{% set enabled = printer["gcode_macro RatOS"].cartographer_touch_start_print_true_zero|default(true)|lower == 'true' %}
	{% if enabled %}
		{% set z_speed = printer["gcode_macro RatOS"].macro_z_speed|float * 60 %}
		{% set default_toolhead = printer["gcode_macro RatOS"].default_toolhead|default(0)|int %}
		{% set heater = "extruder" if default_toolhead == 0 else "extruder1" %}
		{% set touch_settings = printer.fastconfig.settings["cartographer touch"]|default({}) %}
		{% set max_touch_temp = touch_settings.unsafe_max_touch_temperature|default(150)|int %}
		{% set touch_temp = [printer["gcode_macro RatOS"].cartographer_touch_true_zero_temp|default(150)|int, max_touch_temp]|min %}

		{% if printer.cartographer.touch.current_model == "none" %}
			CONSOLE_ECHO TYPE="error" TITLE="No Cartographer touch model" MSG="Run CARTOGRAPHER_TOUCH_CALIBRATE first, then SAVE_CONFIG._N_Or disable touch true zero in printer.cfg:_N__N_[gcode_macro RatOS]_N_variable_cartographer_touch_start_print_true_zero: False"
			_STOP_AND_RAISE_ERROR MSG="No Cartographer touch model"
		{% endif %}

		RATOS_ECHO PREFIX="Cartographer" MSG="Setting nozzle to {touch_temp}C for touch true zero..."
		SET_HEATER_TEMPERATURE HEATER={heater} TARGET={touch_temp}
		TEMPERATURE_WAIT SENSOR={heater} MINIMUM={touch_temp - 5} MAXIMUM={touch_temp + 1}

		RATOS_ECHO PREFIX="Cartographer" MSG="Touch homing Z (true zero)..."
		CARTOGRAPHER_TOUCH_HOME
		G0 Z5 F{z_speed}
	{% endif %}

[gcode_macro CARTOGRAPHER_RATOS_STATUS]
description: Shows the Cartographer state as seen by RatOS.
gcode:
	{% set c = printer.cartographer %}
	{% set s = printer.fastconfig.settings.cartographer %}
	RATOS_ECHO PREFIX="Cartographer" MSG="offsets x={s.x_offset} y={s.y_offset}"
	RATOS_ECHO PREFIX="Cartographer" MSG="scan model: {c.scan.current_model} (available: {c.scan.models})"
	RATOS_ECHO PREFIX="Cartographer" MSG="touch model: {c.touch.current_model} (available: {c.touch.models})"
	RATOS_ECHO PREFIX="Cartographer" MSG="touch true zero in START_PRINT: {printer['gcode_macro RatOS'].cartographer_touch_start_print_true_zero}, temp: {printer['gcode_macro RatOS'].cartographer_touch_true_zero_temp}C"
	RATOS_ECHO PREFIX="Cartographer" MSG="zero_reference_position: {printer.fastconfig.settings.bed_mesh.zero_reference_position}"

